version: '3.8'

services:
  # This is the advanced Python backend from your 'security_tool'
  backend:
    build: ./security_tool
    ports:
      - "5001:5001"
    volumes:
      - ./security_tool:/app
      - ./logs:/app/logs

  # Nginx will serve the frontend and act as a reverse proxy
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./frontend:/usr/share/nginx/html
    depends_on:
      - backend

  # The AEMTD Java Proxy is the main entry point for protected traffic
  aemtd-proxy:
    build: ./AEMTD_Proxy
    ports:
      - "8080:8080"
    depends_on:
      - nginx