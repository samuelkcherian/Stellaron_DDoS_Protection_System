# docker-compose.yml


services:
  # The Python Flask Application Service
  backend:
    build: ./backend
    command: gunicorn --bind 0.0.0.0:5000 app:app
    volumes:
      - ./backend:/app
    working_dir: /app

  # The Nginx Proxy Service
  nginx:
    image: nginx:latest
    ports:
      - "80:80" # Expose port 80 to the host machine
    volumes:
      # Mount our custom nginx configuration into the container
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      # Mount the blocklist file
      - ./nginx/blocklist.conf:/etc/nginx/blocklist.conf
      # Mount a volume for the access logs so our tool can read them
      - ./logs:/var/log/nginx
    depends_on:
      - backend # Nginx won't start until the backend is ready

volumes:
  logs: